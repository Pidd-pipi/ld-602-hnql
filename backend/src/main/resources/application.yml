server:
  port: ${PORT:8080}

spring:
  application:
    name: rescue-stock
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:app_db}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:app_user}
    password: ${DB_PASSWORD:app_password}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

# 业务配置：临期阈值（天）与限流阈值，改动需同步 .env.example 与 docker-compose
app:
  near-expire-days: ${NEAR_EXPIRE_DAYS:30}
  rate-limit-per-minute: ${RATE_LIMIT_PER_MINUTE:120}
